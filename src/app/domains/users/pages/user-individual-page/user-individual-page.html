<div class="user-detail">
  <a routerLink="/users">← Back to users</a>

  @if (loading$ | async) {
    <div class="loading">Loading user…</div>
  }

  @if (error$ | async; as error) {
    <div class="error">{{ error }}</div>
  }

  @if (!(loading$ | async)) {
    @if (selectedUser$ | async; as user) {
      <h1>Title: {{ user.title }}</h1>
      <h2><b>Body</b></h2>
      <p>{{ user.body }}</p>
      <h2><strong>ID:</strong> {{ user.id }}</h2>
    } @else {
      <div class="empty">User not found.</div>
    }
  }
</div>
